[project]
name = "vantara-case"
version = "0.1.0"
description = "Read-only investigation of Vantara sample data"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35,<2",
    "openai>=3.26.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vantara"
